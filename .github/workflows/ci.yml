name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, labeled ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.actor == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'dependabot') ||
      contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - uses: actions/checkout@v6
    
    # ── .NET Setup (Api & Worker) ────────────────────────────────────────────────────────
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies (.NET)
      run: dotnet restore src/InventoryManagementSystem.sln
      
    - name: Build (.NET)
      run: dotnet build src/InventoryManagementSystem.sln --no-restore --configuration Release

    - name: Architecture Test
      run: dotnet test src/test/InventoryAlert.ArchitectureTests/InventoryAlert.ArchitectureTests.csproj --no-restore --no-build --configuration Release --verbosity normal
      
    - name: Unit Test & Coverage
      run: |
        dotnet test src/test/InventoryAlert.UnitTests/InventoryAlert.UnitTests.csproj \
          --no-restore --no-build --configuration Release \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          --logger "trx;LogFileName=unittest-results.trx"

    - name: Install Coverage Tools & Generate Report
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool || true
        dotnet tool install --global coverlet.console || true
        reportgenerator \
          -reports:./coverage/**/coverage.cobertura.xml \
          -targetdir:./coverage/report \
          -filefilters:"-*.Migrations.*;-*.AppDbContextModelSnapshot.*;-*.g.cs" \
          -reporttypes:"Html;MarkdownSummary;MarkdownSummaryGithub;TextSummary"
        
        # Display Code Coverage & Test Report in GitHub Action Run Summary UI
        echo "## 📊 Unit Test & Code Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f ./coverage/report/SummaryGithub.md ]; then
          cat ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        elif [ -f ./coverage/report/Summary.md ]; then
          cat ./coverage/report/Summary.md >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f ./coverage/report/Summary.txt ]; then
          echo "### Coverage Metrics Text Breakdown" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat ./coverage/report/Summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Coverage Report Artifact
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: ./coverage/report

    # ── Node.js Setup (UI) ─────────────────────────────────────────────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/ui/InventoryAlert.UI/package-lock.json

    - name: Install UI dependencies
      run: npm ci
      working-directory: src/ui/InventoryAlert.UI

    - name: UI Lint
      run: npm run lint
      working-directory: src/ui/InventoryAlert.UI

    - name: UI Test
      run: npm run test
      working-directory: src/ui/InventoryAlert.UI

    # ── Docker Integration & E2E Tests ──────────────────────────────────────────────
    - name: Seed Configuration Files (CI)
      run: |
        cp InventoryAlert.Api/appsettings.Example.json InventoryAlert.Api/appsettings.json
        cp InventoryAlert.Worker/appsettings.Example.json InventoryAlert.Worker/appsettings.json
      working-directory: src

    - name: Start Docker Stack
      id: start-docker
      run: |
        docker compose up -d --build || (echo "Docker Compose failed to start" && docker ps -a && docker compose logs api && docker compose logs db && exit 1)
      working-directory: src

    - name: Wait for Services Health (API & Worker)
      run: |
        echo "Waiting for API & Worker to be healthy..."
        for i in {1..30}; do
          API_HEALTH=$(curl -s http://127.0.0.1:8080/health | grep -q '"status":"Healthy"' && echo "UP" || echo "DOWN")
          WORKER_HEALTH=$(curl -s http://127.0.0.1:8081/health | grep -q '"status":"Healthy"' && echo "UP" || echo "DOWN")
          
          echo "[$i/30] API: $API_HEALTH | Worker: $WORKER_HEALTH"
          
          if [ "$API_HEALTH" = "UP" ] && [ "$WORKER_HEALTH" = "UP" ]; then
            echo "All services are Healthy!"
            exit 0
          fi
          sleep 5
        done
        echo "Error: Services failed to reach healthy state within 150s"
        docker compose logs api
        docker compose logs worker
        exit 1
      shell: bash
      working-directory: src

    - name: Integration Test - Api
      run: |
        cp src/test/InventoryAlert.IntegrationTests/appsettings.test.json appsettings.test.json
        dotnet test src/test/InventoryAlert.IntegrationTests/InventoryAlert.IntegrationTests.csproj --no-restore --no-build --configuration Release --verbosity normal --filter Category=Api

    - name: Integration Test - Jobs
      run: |
        cp src/test/InventoryAlert.IntegrationTests/appsettings.test.json appsettings.test.json
        dotnet test src/test/InventoryAlert.IntegrationTests/InventoryAlert.IntegrationTests.csproj --no-restore --no-build --configuration Release --verbosity normal --filter Category=Jobs

    - name: Run E2E Tests
      run: dotnet test src/test/InventoryAlert.E2ETests/InventoryAlert.E2ETests.csproj --no-restore --configuration Release --verbosity normal

    - name: Docker Cleanup
      if: always()
      run: docker compose down -v --rmi local
      working-directory: src

