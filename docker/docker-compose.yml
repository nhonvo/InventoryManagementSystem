name: inventory-alert-dev

# ==============================================================================
# INVENTORYALERT — LOCAL DEVELOPMENT STACK
# ==============================================================================
# 💻 Development Stack:
#   - API (Dev):        http://localhost:8080 (Swagger: /swagger, Health: /health)
#   - Worker (Dev):     http://localhost:8081 (Hangfire Dashboard)
#   - UI (Dev):         http://localhost:3000 (Next.js 15)
#   - PostgreSQL (Dev): localhost:5433 (Internal 5432)
#   - Redis (Dev):      localhost:6379
#   - Moto Emulator:    http://localhost:5000 (SQS + DynamoDB)
#   - DynamoDB Admin:   http://localhost:8001
#   - Seq Logs:         http://localhost:5341
#   - WireMock:         http://localhost:9091
# ==============================================================================

volumes:
  pgdata_dev:
  redisdata_dev:

services:
  # ── PostgreSQL: Local Domain Storage ──────────────────
  db:
    image: postgres:17-alpine
    container_name: inventory-db-dev
    environment:
      - POSTGRES_DB=inventory_alert_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_alert_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  # ── Redis: Local Job State + Cache ────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: inventory-cache-dev
    volumes:
      - redisdata_dev:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  # ── Moto: AWS Mock (SQS / DynamoDB / SNS) ─────────────
  moto:
    image: motoserver/moto:5.1.22
    container_name: inventory-moto-dev
    ports:
      - "5000:5000"
    environment:
      - MOTO_HOST=0.0.0.0
      - MOTO_PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - default
    restart: unless-stopped

  # ── Moto Init: Infra Provisioning ─────────────────────
  moto-init:
    image: amazon/aws-cli:latest
    container_name: inventory-moto-init-dev
    depends_on:
      moto:
        condition: service_healthy
    volumes:
      - ./src/SolutionFolder/moto-init:/moto-init:ro
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://moto:5000
    entrypoint: ["/bin/sh", "-c", "sh /moto-init/init-all.sh"]
    networks:
      - default

  # ── DynamoDB Admin: GUI Dashboard ─────────────────────
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: inventory-dynamo-admin-dev
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://moto:5000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      moto:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # ── Seq: Structured Logging ───────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: inventory-seq-dev
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    networks:
      - default
    restart: unless-stopped

  # ── WireMock: External Finnhub API Mock ───────────────
  wiremock:
    image: wiremock/wiremock:latest
    container_name: inventory-wiremock-dev
    ports:
      - "9091:8080"
    volumes:
      - ./src/test/InventoryAlert.IntegrationTests/Wiremock:/home/wiremock
    command:
      - "--global-response-templating"
      - "--verbose"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
    restart: unless-stopped

  # ── API: REST + Event Publisher (.NET 10) ─────────────
  api:
    build:
      context: ./src
      dockerfile: InventoryAlert.Api/Dockerfile
    container_name: inventory-api-dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Redis__ConnectionString=redis:6379
      - Seq__ServerUrl=http://seq:80
      - Api__EnableBodyLogging=true
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - Finnhub__ApiKey=${FINNHUB_API_KEY:-YOUR_FINNHUB_KEY}
      - Database__DefaultConnection=Host=db;Database=inventory_alert_db;Username=postgres;Password=postgres
      - Aws__EndpointUrl=http://moto:5000
      - Aws__SqsQueueUrl=http://moto:5000/123456789012/event-queue
      - Aws__SqsDlqUrl=http://moto:5000/123456789012/inventory-event-dlq
      - Aws__SnsTopicArn=arn:aws:sns:us-east-1:123456789012:inventory-events
    depends_on:
      db:
        condition: service_healthy
      moto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
    restart: unless-stopped

  # ── Worker: Hangfire + SQS Consumer ───────────────────
  worker:
    build:
      context: ./src
      dockerfile: InventoryAlert.Worker/Dockerfile
    container_name: inventory-worker-dev
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Redis__ConnectionString=redis:6379
      - Seq__ServerUrl=http://seq:80
      - Worker__EnablePayloadLogging=true
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - Finnhub__ApiKey=${FINNHUB_API_KEY:-YOUR_FINNHUB_KEY}
      - Database__DefaultConnection=Host=db;Database=inventory_alert_db;Username=postgres;Password=postgres
      - Aws__EndpointUrl=http://moto:5000
      - Aws__SqsQueueUrl=http://moto:5000/123456789012/event-queue
      - Aws__SnsTopicArn=arn:aws:sns:us-east-1:123456789012:inventory-events
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
    restart: unless-stopped

  # ── UI: Next.js 15 Frontend ───────────────────────────
  ui:
    build:
      context: ./src/ui/InventoryAlert.UI
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: inventory-ui-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: inventory-dev-net
    external: true
