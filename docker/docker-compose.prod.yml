name: inventory-alert-prod

# ==============================================================================
# INVENTORYALERT — PRODUCTION STACK
# ==============================================================================
# 🚀 Production Stack:
#   - API (Prod):       http://localhost:8090 (Swagger /health)
#   - Worker (Prod):    http://localhost:8091 (Hangfire Dashboard)
#   - UI (Prod):        http://localhost:3002 (Next.js 15)
#   - Moto Emulator:    http://localhost:5001 (SQS + DynamoDB)
#   - DynamoDB Admin:   http://localhost:8002
#   - Remote DB:        Neon PostgreSQL (Serverless Cloud)
#   - Remote Cache:     Upstash Redis (Serverless Cloud)
# ==============================================================================

services:
  # ── Moto AWS Emulator (SQS, SNS, DynamoDB) ────────────────
  moto-prod:
    image: motoserver/moto:5.1.22
    container_name: inventory-moto-prod
    ports:
      - "5001:5000"
    environment:
      - MOTO_HOST=0.0.0.0
      - MOTO_PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - default
    restart: unless-stopped

  # ── Moto Provisioning (Queues, Topics, Tables) ────────────
  moto-init-prod:
    image: amazon/aws-cli:latest
    container_name: inventory-moto-init-prod
    depends_on:
      moto-prod:
        condition: service_healthy
    volumes:
      - ./src/SolutionFolder/moto-init:/moto-init:ro
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=http://moto-prod:5000
    entrypoint: ["/bin/sh", "-c", "sh /moto-init/init-all.sh"]
    networks:
      - default

  # ── DynamoDB GUI Viewer (Prod emulator) ───────────────────
  dynamodb-admin-prod:
    image: aaronshaf/dynamodb-admin:latest
    container_name: inventory-dynamo-admin-prod
    ports:
      - "8002:8001"
    environment:
      - DYNAMO_ENDPOINT=http://moto-prod:5000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      moto-prod:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # ── Production API (.NET 10) ──────────────────────────────
  api_prod:
    build:
      context: ./src
      dockerfile: InventoryAlert.Api/Dockerfile
    container_name: inventory-api-prod
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - ASPNETCORE_URLS=http://+:8080
      - Api__EnableBodyLogging=true
      - Database__DefaultConnection=${PROD_DATABASE_CONNECTION:-Host=ep-late-mode-azygp34n.c-3.ap-southeast-1.aws.neon.tech;Database=neondb;Username=neondb_owner;Password=npg_l1MGrLnw6JTd;SSL Mode=Require;Trust Server Certificate=true}
      - Redis__ConnectionString=${PROD_REDIS_CONNECTION:-ace-urchin-70713.upstash.io:6379,password=gQAAAAAAARQ5AAIgcDJmYjU2MGI4OGE2YTY0OWIxOGI1MTYyMTgwMDkyYmI5ZQ,ssl=True,abortConnect=False}
      - Finnhub__ApiBaseUrl=https://finnhub.io/api/v1
      - Finnhub__ApiKey=${FINNHUB_API_KEY:-d9tuvppr01qujo6mhijgd9tuvppr01qujo6mhik0}
      - Finnhub__SyncIntervalMinutes=30
      - Jwt__Audience=InventoryAlert.Web
      - Jwt__Issuer=InventoryAlert.Api
      - Jwt__Key=${JWT_KEY:-InventoryAlert_Super_Secret_Production_32_Char_Key!}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - Aws__EndpointUrl=http://moto-prod:5000
      - Aws__SnsTopicArn=arn:aws:sns:us-east-1:123456789012:inventory-events
      - Aws__SqsQueueUrl=http://moto-prod:5000/123456789012/inventory-event-queue
      - Aws__SqsDlqUrl=http://moto-prod:5000/123456789012/inventory-event-dlq
    depends_on:
      moto-init-prod:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
    restart: unless-stopped

  # ── Production Worker (Hangfire + SQS Consumer) ───────────
  worker_prod:
    build:
      context: ./src
      dockerfile: InventoryAlert.Worker/Dockerfile
    container_name: inventory-worker-prod
    ports:
      - "8091:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - Worker__EnablePayloadLogging=true
      - Database__DefaultConnection=${PROD_DATABASE_CONNECTION:-Host=ep-late-mode-azygp34n.c-3.ap-southeast-1.aws.neon.tech;Database=neondb;Username=neondb_owner;Password=npg_l1MGrLnw6JTd;SSL Mode=Require;Trust Server Certificate=true}
      - Redis__ConnectionString=${PROD_REDIS_CONNECTION:-ace-urchin-70713.upstash.io:6379,password=gQAAAAAAARQ5AAIgcDJmYjU2MGI4OGE2YTY0OWIxOGI1MTYyMTgwMDkyYmI5ZQ,ssl=True,abortConnect=False}
      - Finnhub__ApiBaseUrl=https://finnhub.io/api/v1
      - Finnhub__ApiKey=${FINNHUB_API_KEY:-d9tuvppr01qujo6mhijgd9tuvppr01qujo6mhik0}
      - Finnhub__SyncIntervalMinutes=30
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - Aws__EndpointUrl=http://moto-prod:5000
      - Aws__SnsTopicArn=arn:aws:sns:us-east-1:123456789012:inventory-events
      - Aws__SqsQueueUrl=http://moto-prod:5000/123456789012/inventory-event-queue
    depends_on:
      api_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
    restart: unless-stopped

  # ── Production Next.js UI ─────────────────────────────────
  ui_prod:
    build:
      context: ./src/ui/InventoryAlert.UI
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8090
    container_name: inventory-ui-prod
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8090
    depends_on:
      api_prod:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: inventory-prod-net
    external: true
